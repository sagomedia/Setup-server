services:
  # ============================================================================
  # 0. REVERSE PROXY & DASHBOARD (Port 8000)
  # ============================================================================
  gateway:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8000}:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - filebrowser
      - jellyfin

  # ============================================================================
  # 1. FILEBROWSER — Web File & Movie Manager (Port 8088)
  # Mounts the root data directory so users can upload movies, files, and photos
  # directly from their browser on any device!
  # ============================================================================
  filebrowser:
    image: filebrowser/filebrowser:latest
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ${FILEBROWSER_DATA:-./data}:/srv
      - ./data/filebrowser:/database
    environment:
      - FB_DATABASE=/database/filebrowser.db
      - FB_ROOT=/srv
      - PUID=1000
      - PGID=1000

  # ============================================================================
  # 2. JELLYFIN — Private Netflix / OTT Streaming Server (DLNA & Smart TV)
  # ============================================================================
  jellyfin:
    image: jellyfin/jellyfin:latest
    restart: unless-stopped
    ports:
      - "8096:8096"
      - "1900:1900/udp"
      - "7359:7359/udp"
    volumes:
      - ./data/jellyfin/config:/config
      - ./data/jellyfin/cache:/cache
      - ${MEDIA_MOVIES:-./data/media/movies}:/media/movies
      - ${MEDIA_SHOWS:-./data/media/shows}:/media/shows
    environment:
      - PUID=1000
      - PGID=1000

  # ============================================================================
  # 3. IMMICH — Private Google Photos Alternative (Official Latest Stack)
  # ============================================================================
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    restart: unless-stopped
    ports:
      - "2283:2283"
    volumes:
      - ${UPLOAD_LOCATION:-./data/immich/photos}:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DB_HOSTNAME=database
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD:-database_secret_password}
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=redis
      - IMMICH_MACHINE_LEARNING_URL=http://immich-machine-learning:3003
    env_file:
      - .env
    depends_on:
      - redis
      - database

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    container_name: immich_machine_learning
    restart: unless-stopped
    volumes:
      - ./data/immich/model-cache:/cache
    env_file:
      - .env

  redis:
    image: docker.io/valkey/valkey:8-alpine
    restart: unless-stopped

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-database_secret_password}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_DB: ${DB_DATABASE_NAME:-immich}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION:-./data/immich/postgres}:/var/lib/postgresql/data
    shm_size: 512mb

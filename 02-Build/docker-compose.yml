services:
  # ============================================================================
  # 0. SAGO REVERSE PROXY & DASHBOARD (Port 80 & Port 8000)
  # ============================================================================
  gateway:
    image: nginx:alpine
    container_name: sago-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "8000:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - filebrowser
      - jellyfin

  # ============================================================================
  # 1. FILEBROWSER — Private Web Google Drive (Port 8082)
  # ============================================================================
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: sago-filebrowser
    restart: unless-stopped
    ports:
      - "${FILEBROWSER_PORT:-8082}:80"
    volumes:
      - ${FILEBROWSER_DATA:-./data/files}:/srv
      - ./data/filebrowser/database.db:/database.db
      - ./data/filebrowser/settings.json:/.filebrowser.json
    environment:
      - PUID=1000
      - PGID=1000

  # ============================================================================
  # 2. JELLYFIN — Private Netflix / OTT Streaming Server (DLNA & Smart TV)
  # ============================================================================
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: sago-jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096"
      - "1900:1900/udp"
      - "7359:7359/udp"
    volumes:
      - ./data/jellyfin/config:/config
      - ./data/jellyfin/cache:/cache
      - ${MEDIA_MOVIES:-./data/media/movies}:/media/movies
      - ${MEDIA_SHOWS:-./data/media/shows}:/media/shows
    environment:
      - PUID=1000
      - PGID=1000

  # ============================================================================
  # 3. IMMICH — Private Google Photos Alternative (AI Facial Recognition)
  # ============================================================================
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    container_name: immich_server
    restart: unless-stopped
    ports:
      - "2283:2283"
    volumes:
      - ${UPLOAD_LOCATION:-./data/immich/photos}:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DB_HOSTNAME=database
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD:-sago_home_server_supersecret}
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=redis
    env_file:
      - .env
    depends_on:
      - redis
      - database

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    container_name: immich_machine_learning
    restart: unless-stopped
    volumes:
      - ./data/immich/model-cache:/cache
    env_file:
      - .env

  redis:
    container_name: immich_redis
    image: redis:6.2-alpine
    restart: unless-stopped

  database:
    container_name: immich_postgres
    image: tensorchord/pgvecto-rs:pg14-v0.2.0
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sago_home_server_supersecret}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_DB: ${DB_DATABASE_NAME:-immich}
    volumes:
      - ${DB_DATA_LOCATION:-./data/immich/postgres}:/var/lib/postgresql/data
    shm_size: 128mb
